# Claude PR reviews, paid by Bibek's Claude subscription (secret: CLAUDE_CODE_OAUTH_TOKEN).
# - Every new PR (or draft marked ready): a bug review, then a security review.
# - Anytime: comment "@claude ..." on a PR or issue (e.g. "@claude review again").
# To change models or effort, edit the lines marked "CHOICE" below.
#   Models: claude-fable-5-2 | claude-opus-5-5 | claude-sonnet-5-5 | claude-haiku-5-5
#   Effort: low | medium | high | xhigh | max
name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  code-review:
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # CHOICE: bug review - main reviewer model and effort
          claude_args: |
            --model claude-fable-5-2
            --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
          # CHOICE: bug review - helper agents. The review plugin asks for helpers by name
          # (haiku / sonnet / opus); these lines decide which model each name really uses.
          #   HAIKU  -> quick pre-checks: is the PR a draft or already reviewed, find CLAUDE.md files
          #   SONNET -> PR summary + checking the code against CLAUDE.md rules
          #   OPUS   -> the two bug hunters + double-checking every bug before it's posted
          settings: |
            {
              "env": {
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "claude-sonnet-5-5",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "claude-opus-5-5",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "claude-fable-5-2"
              }
            }

  security-review:
    # Runs after the bug review so the two never race each other.
    needs: code-review
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a senior security engineer. Review ONLY the changes this pull request introduces.

            1. Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`. Read surrounding code in the checkout when you need context.
            2. Report only high-confidence vulnerabilities that look genuinely exploitable, such as: injection (SQL, command, path traversal, template, unsafe deserialization), authentication or authorization bypass, credentials or API keys committed in code, unvalidated untrusted input reaching dangerous sinks, SSRF, XSS, weak or misused cryptography, and exposure of sensitive data.
            3. Skip style issues, theoretical concerns, denial of service or rate limiting, and problems that existed before this PR.
            4. For each finding, post an inline comment on the relevant line with mcp__github_inline_comment__create_inline_comment (confirmed: true). Say how severe it is, what an attacker could do, and how to fix it.
            5. Finish with exactly one PR comment, posted with `gh pr comment`, headed "Security review": list the findings briefly, or say that no security issues were found.
          # CHOICE: security review - model and effort
          claude_args: |
            --model claude-fable-5-2
            --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"

  claude:
    # "@claude <request>" in a PR or issue comment: re-review, explain, or fix things on request.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # CHOICE: "@claude" requests - model and effort
          claude_args: |
            --model claude-opus-5-5
            --effort high
